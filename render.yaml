databases:
  - name: delta-postgres
    plan: free
    region: oregon
    databaseName: delta_db
    user: delta_user

services:
  - type: web
    name: antigravity-ui
    runtime: go
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && go build -o server ."
    startCommand: "./backend/server"
    envVars:
      - key: GIN_MODE
        value: release
      - key: DATABASE_URL
        fromDatabase:
          name: delta-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
